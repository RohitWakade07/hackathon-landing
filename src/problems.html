<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Problem Statements | HackNova 2025</title>
            <link rel="stylesheet" href="style.css"/>
            <style>
                html, body {
                    font-size: 15px;
                }
            </style>
        <!-- Bootstrap 4 CDN -->
        <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" />
        <script defer src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
        <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>
        <style>
            .pos-f-t { margin-bottom: 0; }
            .navbar-dark { background: #222 !important; }
            .bg-dark { background: #222 !important; }
            .navbar-toggler { border-color: #fff; }
            .navbar-toggler-icon {
                background-image: url("data:image/svg+xml;charset=utf8,%3Csvg viewBox='0 0 30 30' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath stroke='rgba%28255,255,255,1%29' stroke-width='2' stroke-linecap='round' stroke-miterlimit='10' d='M4 7h22M4 15h22M4 23h22'/%3E%3C/svg%3E");
            }
            .drawer-links a {
                color: #08CB00 !important;
                font-weight: 600;
                font-size: 1.1em;
                letter-spacing: 0.5px;
                transition: color 0.2s, background 0.2s;
                border-radius: 6px;
                padding: 6px 12px;
                text-decoration: none;
                display: block;
            }
            .drawer-links a:hover {
                color: #fff !important;
                background: #08CB00 !important;
            }
            .drawer-title {
                color: #08CB00 !important;
                font-weight: 700;
                font-size: 1.3em;
            }
        </style>
</head>
<body>
       <nav class="navbar navbar-dark bg-dark">
                <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarToggleExternalContent" aria-controls="navbarToggleExternalContent" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
            </nav>
        <div class="pos-f-t">
            <div class="collapse" id="navbarToggleExternalContent">
                <div class="bg-dark p-4">
                    <h4 class="drawer-title">HackNova 2025</h4>
                    <div class="mt-3 drawer-links">
                        <a href="index.html" class="mb-2">Home</a>
                        <a href="#about" class="mb-2">About</a>
                        <a href="FAQ.html" class="mb-2">FAQ</a>
                        <a href="problems.html" class="mb-2">Problems</a>
                        <a href="#contact" class="mb-2">Contact Us</a>
                        <a href="team.html" class="mb-2">Organizers</a>
                    </div>
                </div>
            </div>

        <canvas id="bgCanvas"></canvas>
    <section id="problems">
        <div class="tracks-select" style="display:flex;gap:32px;justify-content:center;margin:32px 0 40px 0;">
            <button class="btn btn-ghost" onclick="document.getElementById('track1').scrollIntoView({behavior:'smooth'})">Track 1: Next-Gen Agri AI & Data Science</button>
            <button class="btn btn-ghost" onclick="document.getElementById('track2').scrollIntoView({behavior:'smooth'})">Track 2: Web & AI Applications</button>
        </div>
        <div id="track1">
                        <h2 class="section-heading">Track 1: Next-Gen Agri AI & Data Science</h2>
            <div id="track1-list"></div>
        </div>
        
                                <div id="track2">
            <h2 class="section-heading">Track 2: Web & AI Applications</h2>
            <div id="track2-list"></div>
        </div>
    </section>

    <script>
        async function loadProblems(){
            try{
                const resp = await fetch('/api/problems');
                const arr = await resp.json();
                const t1 = document.getElementById('track1-list');
                const t2 = document.getElementById('track2-list');
                t1.innerHTML = '';
                t2.innerHTML = '';
                arr.forEach(p=>{
                    const el = document.createElement('div');
                    el.className = 'blur-card';
                    const outcomes = Array.isArray(p.outcomes) ? p.outcomes : [];
                    const datasets = Array.isArray(p.datasets) ? p.datasets : [];
                    el.innerHTML = `<div style="display:flex;align-items:center;justify-content:space-between;"><h3 style="margin-bottom:0;">${p.title}</h3>
                        <button class="btn btn-sm btn-primary" type="button" data-toggle="collapse" data-target="#${p.id}" aria-expanded="false">Details</button></div>
                        <div class="collapse" id="${p.id}"><div class="card card-body mt-2">
                            <div class="problem-desc"><strong>Description:</strong> ${p.description || p.details || p.summary || ''}</div>
                            ${outcomes.length ? `<div class="problem-outcomes" style="margin-top:8px;"><strong>Expected Outcomes:</strong><ul>${outcomes.map(o=>`<li>${o}</li>`).join('')}</ul></div>` : ''}
                            ${datasets.length ? `<div class="dataset-links" style="margin-top:8px;"><strong>Data sets:</strong><ul>${datasets.map(d=>`<li>${/^https?:\/\//.test(String(d))?`<a href=\"${d}\" target=\"_blank\">${d}</a>`: d}</li>`).join('')}</ul></div>` : ''}
                        </div></div>`;
                    if((p.track||'').toLowerCase().includes('track 1')) t1.appendChild(el); else t2.appendChild(el);
                });
            }catch(e){ console.error('Could not load problems', e); }
        }
        loadProblems();
    </script>
</body>
</html>
