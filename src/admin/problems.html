<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Admin — Problems</title>
  <style>body{font-family:Arial;margin:12px} textarea{width:100%;height:220px}</style>
  <script>
    async function load(){
      const token = new URLSearchParams(location.search).get('token');
      const hdr = token ? '?token='+encodeURIComponent(token) : '';
      const data = await fetch('/api/problems').then(r=>r.json());
      document.getElementById('json').value = JSON.stringify(data, null, 2);
    }
    async function save(){
      const token = new URLSearchParams(location.search).get('token');
      const hdr = token ? '?token='+encodeURIComponent(token) : '';
      const arr = JSON.parse(document.getElementById('json').value);
      const resp = await fetch('/api/problems'+hdr, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify(arr)});
      alert((await resp.json()).message || 'OK');
    }
  </script>
</head>
<body onload="load()">
  <h2>Problems Editor</h2>
  <p>Modify the problems JSON and <button onclick="save()">Save</button></p>
  <textarea id="json"></textarea>
</body>
</html>
