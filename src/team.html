<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Our Team | HackNova 2025</title>

  <!-- Bootstrap 4 CDN -->
  <link rel="stylesheet" href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css"/>
  <script defer src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@4.5.2/dist/js/bootstrap.bundle.min.js"></script>

  <style>
    body {
      background: #fff;
      font-family: 'Inter', Arial, sans-serif;
      color: #222;
      margin: 0;
    }
    
    .image-row {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 32px;
      background: #fff;
      padding: 32px 0 16px;
      flex-wrap: wrap;
    }
    .image-row img {
      background: #fff;
      border-radius: 12px;
      box-shadow: 0 2px 12px rgba(0,0,0,0.06);
      max-height: 120px;
      object-fit: contain;
      padding: 8px;
    }
    .whatsapp-img {
      filter: brightness(1.1) contrast(1.2);
    }
    .section-heading {
      text-align: center;
      font-size: 2em;
      margin: 32px 0 24px;
      color: #253900;
      font-weight: 700;
    }
    .team-grid {
      display: flex;
      flex-wrap: wrap;
      gap: 32px;
      justify-content: center;
      margin-bottom: 48px;
    }
    .team-card {
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 4px 24px rgba(8,203,0,0.08);
      padding: 32px 24px;
      min-width: 240px;
      max-width: 320px;
      text-align: center;
      transition: transform 0.3s, box-shadow 0.3s;
    }
    .team-card:hover {
      transform: translateY(-8px) scale(1.04);
      box-shadow: 0 8px 32px rgba(8,203,0,0.18);
    }
    .team-card h3 {
      margin-bottom: 10px;
      font-size: 1.2em;
      color: #08CB00;
      font-weight: 600;
    }
    .team-card .name {
      font-size: 1.1em;
      color: #222;
      font-weight: 700;
      margin-bottom: 4px;
    }
    .team-card .desc {
      font-size: 0.98em;
      color: #555;
      margin-top: 8px;
    }
    @media (max-width: 700px) {
      .team-card { min-width: 90vw; max-width: 98vw; }
    }
  </style>
</head>
<body>

  <nav class="navbar navbar-dark bg-dark">
    <button class="navbar-toggler" type="button" data-toggle="collapse" data-target="#navbarToggleExternalContent" aria-controls="navbarToggleExternalContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
    </button>
</nav>
<div class="pos-f-t">
<div class="collapse" id="navbarToggleExternalContent">
    <div class="bg-dark p-4">
        <h4 class="drawer-title">HackNova 2025</h4>
        <div class="mt-3 drawer-links">
            <a href="index.html" class="mb-2">Home</a>
            <a href="#about" class="mb-2">About</a>
            <a href="FAQ.html" class="mb-2">FAQ</a>
            <a href="problems.html" class="mb-2">Problems</a>
            <a href="#contact" class="mb-2">Contact Us</a>
            <a href="team.html" class="mb-2">Organizers</a>
        </div>
    </div>
</div>

  <!-- Logos -->
  <div class="image-row">
    <img class="no-bg" src="/images/WhatsApp%20Image%202025-08-13%20at%2014.02.39_cda59fac.jpg" alt="Event" />
    <img src="/images/DSSA_VIT.jpg" alt="DSSA VIT Logo" />
  </div>

  <!-- Team Section -->
  <section id="team">
    <h2 class="section-heading">Meet the Organizers</h2>
    <div class="team-grid" id="teamGrid"></div>
  </section>

  <script>
    const team = [
      { role: "Director", name: "Prof. Dr. R. M. Jalnekar", desc: "Director, VIT Pune Visionary leader and mentor.",
      img:"/images/Dr-R-M-Jalnekar.jpg  "//www.vit.edu/wp-content/uploads/2024/03/Dr-R-M-Jalnekar.jpg"
       },
      { role: "Head Of Department", name: "Prof. Deepa Abin", desc: "Head of Department, Computer Science and Engineering (Data Science), VIT Pune.", img: "/images/Dr.Deepa_Abin.jpg" },
      { role: "Faculty Coordinator", name: "Sayali Prakash Shinde", desc: "Assistant Professor, Computer Science and Engineering (Data Science), VIT Pune.", img: "/images/Sayali_Shinde.jpg" },
      { role: "Faculty Coordinator", name: "Ashwini Ranjit Nawadkar", desc: "Assistant Professor, Computer Science and Engineering (Data Science), VIT Pune.", img: "/images/Ashwini_Nawadkar.jpg" },
      { role: "Industry Expert", name: "Dr. AOK", desc: "Industry expert and mentor from Agharkar Research Institute.", img: "https://example.com/aok.jpg" },
      { role: "Organizing Club", name: "DSSA", desc: "Student lead, managing logistics and communication." },
      { role: "Tech Lead", name: "Rohit Wakade", desc: "Full-stack developer, web and backend lead." },
      
    ];

    function cardHTML(member) {
      return `<div class="team-card">
        <h3>${member.role}</h3>
  ${member.img ? `<img src="${member.img}" alt="${member.name}" style="width:100px;height:120px;border-radius:10px;margin-bottom:10px;object-fit:cover;box-shadow:0 2px 8px rgba(8,203,0,0.12);" />` : ""}
        <div class="name">${member.name}</div>
        <div class="desc">${member.desc}</div>
      </div>`;
    }

    document.getElementById('teamGrid').innerHTML = team.map(cardHTML).join('');
  </script>

</body>
</html>
